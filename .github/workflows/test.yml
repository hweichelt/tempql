name: run CI test

on:
  push:
    branches: ["main", "*"]
  pull_request:
  workflow_call:

env:
  FORCE_COLOR: "3"

jobs:
  build:
    name: test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # os: [ubuntu-latest, macos-latest, windows-latest]
        os: [ubuntu-latest]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: |
            3.12
            3.13
            3.14
            3.15

      - name: install requirements
        run: python -m pip install nox

      - name: run tests
        run: nox
