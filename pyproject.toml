[build-system]
requires = ["setuptools", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[project]
name = "tempql"
authors = [{ name = "Hannes Weichelt", email = "mail@hweichelt.de" }]
description = "A temporal query language for temporal answer set planning programs."
requires-python = ">=3.12"
license = { file = "LICENSE" }
dynamic = ["version"]
readme = "README.md"
dependencies = [
    "clingo==5.8",
]

[project.urls]
Homepage = "https://github.com/hweichelt/temporal-query-language.git/"
Repository = "https://github.com/hweichelt/temporal-query-language"
Issues = "https://github.com/hweichelt/temporal-query-language/issues"
Changelog = "https://github.com/hweichelt/temporal-query-language/blob/master/CHANGES.md"

[project.optional-dependencies]
lint = ["ruff"]
typecheck = ["pytest", "ty", "setuptools"]
dev = ["tempql[typecheck,lint]"]
nox = ["nox"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tempql = ["encodings/*.lp"]

[tool.setuptools_scm]
version_scheme = "python-simplified-semver"
local_scheme = "no-local-version"

[tool.isort]
profile = "black"
line_length = 120

[tool.black]
line-length = 120

[tool.ruff]
line-length = 120
target-version = "py312"
exclude = [
    "/usr/**",
    "**/site-packages/**",
    "**/node_modules/**",
    "**/typeshed-fallback/**",
]

[tool.ruff.lint]
extend-select = ["I", "E", "F", "B", "C4", "D", "ARG", "SIM", "ANN", "Q"]
ignore = [
    "E741",
    "D200",
    "D203",
    "D212",
    "D413",
    "B023", # broken lint
]

[tool.ruff.lint.per-file-ignores]
"noxfile.py" = ["ANN"]
